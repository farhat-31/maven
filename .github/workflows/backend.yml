name: Backend to EC2

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  APP_DIR: /home/ec2-user/app
  REPO_NAME: maven
  REPO_URL: https://github.com/${{ github.repository }}.git
  JAR_NAME: datastore-0.0.7.jar
  APP_PORT: "8084"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and SonarQube Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=backend \
            -Dsonar.projectName=backend \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo yum install -y git maven java-17-amazon-corretto

      - name: Clone / Pull Repository
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: APP_DIR,REPO_NAME,REPO_URL
          script: |
            set -e
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            if [ -d "$REPO_NAME/.git" ]; then
              cd "$REPO_NAME"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone "$REPO_URL" "$REPO_NAME"
            fi

      - name: Build Maven Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: APP_DIR,REPO_NAME
          script: |
            set -e
            cd "$APP_DIR/$REPO_NAME/backend"
            mvn clean package -DskipTests -U

      - name: Stop Old Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script_stop: false
          script: |
            # Match only the java process; the [j] trick stops this script's own
            # command line from matching, and $$ is excluded as a second safeguard.
            PID=$(pgrep -f '[j]ava .*datastore-.*\.jar' | grep -vx "$$" || true)

            if [ -z "$PID" ]; then
              echo "Application is not running."
              exit 0
            fi

            echo "Stopping PID: $PID"
            kill -15 $PID
            sleep 5

            if ps -p $PID > /dev/null 2>&1; then
              echo "Force killing PID: $PID"
              kill -9 $PID
            fi

            echo "Application stopped."

      - name: Start Application
        uses: appleboy/ssh-action@v1.1.0
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: APP_DIR,REPO_NAME,JAR_NAME,APP_PORT,DB_HOST,DB_USERNAME,DB_PASSWORD
          script: |
            LOG_DIR=/var/log/app
            sudo mkdir -p "$LOG_DIR"
            sudo chown ec2-user:ec2-user "$LOG_DIR"
            cd "$APP_DIR/$REPO_NAME/backend/target"

            # DB_HOST must be a bare hostname (no "jdbc:" prefix, no port)
            MYSQL_HOST="$DB_HOST" \
            MYSQL_PORT=3306 \
            MYSQL_USERNAME="$DB_USERNAME" \
            MYSQL_PASSWORD="$DB_PASSWORD" \
            LOG_FILE_PATH="$LOG_DIR/datastore.log" \
            setsid nohup java -jar "$JAR_NAME" --server.port="$APP_PORT" \
              > "$LOG_DIR/nohup.out" 2>&1 < /dev/null &

            echo "Application launched."

      - name: Verify Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          envs: APP_PORT
          script: |
            for i in $(seq 1 12); do
              HEALTH=$(curl -s "http://localhost:$APP_PORT/actuator/health" || true)
              echo "Attempt $i/12: $HEALTH"
              if echo "$HEALTH" | grep -q '^{"status":"UP"'; then
                echo "Application is healthy."
                exit 0
              fi
              sleep 5
            done

            echo "Application did not become healthy. Last 50 lines of nohup.out:"
            tail -n 50 /var/log/app/nohup.out
            exit 1
